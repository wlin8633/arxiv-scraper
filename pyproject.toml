[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weilin-arxiv-scraper"
version = "0.1.0"
description = "Daily arXiv discovery and personal-library archiver"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
arxiv-scraper = "arxiv_scraper.cli:main"

[tool.setuptools.packages.find]
include = ["arxiv_scraper*"]
